<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NHL Live</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="static/css/styles.css?v=7">
</head>

<body>
<header>
  <div class="header-left">
    <button class="header-back-btn" id="header-back-btn" style="display:none;">‹ Назад</button>
  </div>

  <div class="header-brand">
    <h1><span class="dot"></span>NHL LIVE</h1>
    <div class="sub">Матчи, результаты и статистика</div>
  </div>

  <div class="header-right">
    <button class="my-team-btn" id="donate-header-btn" style="border-color:#f1c40f;color:#f1c40f;">☕</button>
    <button class="my-team-btn" id="my-team-trigger">
      <span id="my-team-label">Мой клуб</span>
    </button>
  </div>
</header>

<!-- МЕНЮ: 2 РЯДА ПО 3 КНОПКИ -->
<nav id="main-nav" class="nav-grid-2rows">
  <button id="tab-schedule" class="active">Матчи</button>
  <button id="tab-standings">Таблица</button>
  <button id="tab-players">Лидеры</button>
  <button id="tab-transactions">Трансферы</button>
  <button id="tab-draft">Драфт</button>
  <button id="tab-news">Новости</button>
</nav>

<main>
  <!-- 1. МАТЧИ -->
  <div id="view-schedule">
    <div class="date-row">
      <button id="prev-day">‹</button>
      <input type="date" id="date-picker" class="date-input">
      <button id="next-day">›</button>
    </div>
    <div id="games"><div class="loading">Загрузка матчей...</div></div>
  </div>

  <!-- 2. ТАБЛИЦА -->
  <div id="view-standings" style="display:none">
    <div class="cat-row">
      <button id="std-mode-all" class="active">Общая</button>
      <button id="std-mode-conf">Конференции</button>
      <button id="std-mode-div">Дивизионы</button>
      <button id="std-mode-adv">Продвинутая</button>
    </div>

    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;">
      <span style="font-family:'Oswald',sans-serif;font-size:12px;color:var(--silver-dim);text-transform:uppercase;">Сезон</span>
      <select id="season-select" class="date-input" style="width:auto;flex:1;"></select>
    </div>

    <div class="card" style="padding:0;">
      <div class="table-wrapper">
        <div class="standings-table" id="standings-table-regular">
          <div class="standings-head">
            <div class="sticky-col sticky-col-1"></div>
            <div class="sticky-col sticky-col-2"></div>
            <div class="sticky-col sticky-col-3"></div>
            <div class="sortable" data-sort="gamesPlayed">И</div>
            <div class="sortable" data-sort="wins">В</div>
            <div class="sortable" data-sort="otLosses">ОТ</div>
            <div class="sortable" data-sort="losses">П</div>
            <div class="sortable" data-sort="goalFor">ЗШ</div>
            <div class="sortable" data-sort="goalAgainst">ПШ</div>
            <div class="sortable" data-sort="goalDifferential">+/-</div>
            <div class="sortable" data-sort="points">О</div>
            <div class="sortable" data-sort="pointPctg" title="Процент набранных очков">%О</div>
            <div class="sortable" data-sort="powerPlayPctg">% Б</div>
            <div class="sortable" data-sort="penaltyKillPctg">% М</div>
            <div class="sortable" data-sort="faceoffWinPct">% Вбр</div>
            <div class="sortable" data-sort="shotsForPerGame">Б/И</div>
            <div class="sortable" data-sort="shotsAgainstPerGame">БП/И</div>
          </div>
          <div id="standings-body" style="display:contents;"><div class="loading">Загрузка...</div></div>
        </div>

        <div class="advanced-standings-table" id="standings-table-advanced" style="display:none;">
          <div class="standings-head">
            <div class="sticky-col sticky-col-1"></div>
            <div class="sticky-col sticky-col-2"></div>
            <div class="sticky-col sticky-col-3"></div>
            <div>И</div>
            <div title="Победы в основное">В</div>
            <div title="Победы в овертайме">ВО</div>
            <div title="Победы по буллитам">ВБ</div>
            <div title="Поражения в основное">П</div>
            <div title="Поражения в овертайме">ПО</div>
            <div title="Поражения по буллитам">ПБ</div>
            <div class="sortable" data-adv-sort="satPct">SAT%</div>
            <div class="sortable" data-adv-sort="usatPct">USAT%</div>
            <div class="sortable" data-adv-sort="pdo">PDO</div>
            <div class="sortable" data-adv-sort="ozsp">OZ%</div>
          </div>
          <div id="advanced-standings-body" style="display:contents;"><div class="loading">Загрузка...</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. ЛИДЕРЫ -->
  <div id="view-players" style="display:none">
    <div class="cat-row">
      <button id="leaders-skaters-btn" class="active">Полевые</button>
      <button id="leaders-goalies-btn">Вратари</button>
    </div>

    <!-- ФИЛЬТРЫ ПОЛЕВЫХ -->
    <div id="skater-filters-bar" class="filter-chips-row">
      <button id="filter-rookie-toggle" class="filter-chip">👶 Новички (Calder)</button>
      <button id="filter-pos-d" class="filter-chip">🛡 Защитники (Norris)</button>
      <button id="filter-pos-f" class="filter-chip">⚡ Форварды</button>
    </div>

    <!-- КАТЕГОРИИ ПОЛЕВЫХ -->
    <div id="skater-categories" class="cat-grid-categories">
      <button data-cat="points" class="active">PTS</button>
      <button data-cat="goals">G</button>
      <button data-cat="assists">A</button>
      <button data-cat="pointsPerGame" title="Очки за игру">P/GP</button>
      <button data-cat="plusMinus">+/-</button>
      <button data-cat="powerPlayGoals" title="Голы в большинстве">PPG</button>
      <button data-cat="shorthandedGoals" title="Голы в меньшинстве">SHG</button>
      <button data-cat="shots">SOG</button>
      <button data-cat="gameWinningGoals">GWG</button>
      <button data-cat="hits">HIT</button>
      <button data-cat="blockedShots">BLK</button>
      <button data-cat="penaltyMinutes">PIM</button>
      <button data-cat="toiPerGame">ATOI</button>
    </div>
